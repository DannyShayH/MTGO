services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    command: sleep infinity
    # Share PostgreSQL's network, so it answers on localhost:5432 as in CI.
    # Medusa's test runner forces SSL for any other host, and this PostgreSQL
    # has none. Service names such as redis and postgres still resolve.
    network_mode: service:postgres
    # Jest loads .env.test, not .env, so the test runner reads these from the
    # environment, as the ready flow sets them. Throwaway values, as below.
    environment:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    volumes:
      - ..:/workspaces/mtogo:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medusa-backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medusa-backend"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
