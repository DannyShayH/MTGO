name: Dependency verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/package.json"
      - "package-lock.json"
      - ".github/actions/**"
      - ".github/workflows/**"
      - "scripts/verify-*"
      - "apps/storefront/e2e/**"
      - "apps/storefront/playwright.config.ts"
  push:
    branches: ["[0-9]*"]
    paths:
      - "**/package.json"
      - "package-lock.json"
      - ".github/actions/**"
      - ".github/workflows/**"
      - "scripts/verify-*"
      - "apps/storefront/e2e/**"
      - "apps/storefront/playwright.config.ts"

concurrency:
  group: dependency-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify dependencies without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa_ci_dependencies
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GH_TOKEN: ${{ github.token }}
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_ci_dependencies
      JWT_SECRET: ci-only-jwt-secret
      COOKIE_SECRET: ci-only-cookie-secret
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:8000,http://localhost:9000
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_DEFAULT_REGION: dk
      MEDUSA_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prep-runner
        with:
          report-statuses: "false"
      - name: Install Chromium
        working-directory: apps/storefront
        run: npm exec -- playwright install chromium
      # Keep these stages aligned with ready-checks in .insitu.yml. Run the
      # application harness directly so server output streams instead of being
      # buffered until the entire application check exits.
      - name: Run lint and backend tests
        run: |
          for check in lint coverage integration-modules; do
            GITHUB_ACTIONS=false gh insitu task "$check" --verbose
          done
      - name: Build applications and run browser journeys
        run: npm run verify:applications
      - name: Verify documentation
        run: |
          for check in docs-tests docs-build; do
            GITHUB_ACTIONS=false gh insitu task "$check" --verbose
          done
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/storefront/playwright-report
            apps/storefront/test-results
            apps/partner/playwright-report
            apps/partner/test-results
          if-no-files-found: ignore
          retention-days: 3
      - name: Package the verified Pages output
        uses: actions/upload-pages-artifact@v5
        with:
          name: dependency-pages-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/docs/dist
          retention-days: 1
      - name: Verify the uploaded Pages archive
        run: |
          pages_artifact="dependency-pages-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT"
          pages_check_dir="$RUNNER_TEMP/pages-check"
          downloaded=false
          for attempt in {1..12}; do
            rm -rf "$pages_check_dir"
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$pages_artifact" --dir "$pages_check_dir"; then
              downloaded=true
              break
            fi
            echo "Pages artifact is not visible yet (attempt $attempt/12); retrying in 5 seconds."
            sleep 5
          done
          if [[ "$downloaded" != true ]]; then
            echo "Pages artifact $pages_artifact was not available after 12 attempts."
            exit 1
          fi
          tar -tf "$RUNNER_TEMP/pages-check/artifact.tar" > "$RUNNER_TEMP/pages-files.txt"
          grep -qx './index.html' "$RUNNER_TEMP/pages-files.txt"
          grep -qx './flow-metrics.json' "$RUNNER_TEMP/pages-files.txt"
