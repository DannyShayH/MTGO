name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

concurrency:
  group: "stage"
  cancel-in-progress: false

jobs:
  sonar:
    name: SonarQube Cloud analysis and quality gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download coverage from the Ready run
    steps:
      - name: Checkout full history for analysis
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download backend coverage for the delivered commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          artifact_name="backend-coverage-${GITHUB_SHA}"
          run_id=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="$artifact_name" \
            --jq '.artifacts[] | select(.expired == false and .workflow_run.head_sha == env.GITHUB_SHA) | .workflow_run.id' | head -n 1)
          if [ -z "$run_id" ]; then
            echo "::error::Missing or expired ${artifact_name}. Rerun Ready for this commit to produce coverage."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" --dir apps/backend/coverage
          if [ ! -s apps/backend/coverage/lcov.info ]; then
            echo "::error::${artifact_name} contains no nonempty lcov.info."
            exit 1
          fi
          # Jest uses backend-relative paths; the scanner runs at the repository root.
          sed -i 's|^SF:src/|SF:apps/backend/src/|' apps/backend/coverage/lcov.info

      - name: Analyze main and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

  deploy_artifact_to_pages:
    name: Deploy the docs site when a new commit is pushed to main
    runs-on: ubuntu-latest
    permissions:
      actions: read # required to download workflow artifacts in a private repo
      statuses: write
      pages: write
      id-token: write
      contents: read # explictly required when repository is private, otherwise optional
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Deploys the docs site built and tested by on_ready for this commit
      - name: Deploy docs site to GitHub Pages
        uses: devx-cafe/takt-actions/deploy-artifact@v1
        with:
          artifact_name: github-pages-${{ github.sha }}
          artifact_path: apps/docs/dist
