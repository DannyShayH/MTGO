name: Ready
# This workflow is triggered by 'ready' branches

on:
  workflow_dispatch:
  push:
    branches:
      - "ready/**"

concurrency:
  group: ready
  cancel-in-progress: false

jobs:
  build:
    name: Ready flow, runs when a new commit is pushed to a ready branch
    runs-on: ubuntu-latest
    permissions:
      contents: read # required to push the merge commit to trunk
      statuses: write # required to set the trunk-worthy status check and for gh insitu
      pages: write # required to deploy to GitHub Pages

    # Throwaway database for the Medusa integration tests (lives only for this job)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up and verify runner environment
        uses: ./.github/actions/prep-runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          verify: gh insitu run trunk-worthy

      - name: Lint and integration tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: gh insitu run ready-checks

  merge-to-trunk:
    name: Merge to trunk
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      pull-requests: write
      issues: write
      contents: write

    steps:
      - name: Verify READY_PUSHER secret
        shell: bash
        env:
          READY_PUSHER: ${{ secrets.READY_PUSHER }}
        run: |
          if [ -z "${READY_PUSHER}" ]; then
            echo "ERROR: secrets.READY_PUSHER is not configured."
            echo "Create a PAT with content:write enabled and store it as a repository (or organization) secret named READY_PUSHER."
            echo "GitHub: Settings → Secrets and variables → Actions → New repository secret → Name: READY_PUSHER → Value: <PAT>"
            exit 1
          fi
          echo "READY_PUSHER is configured."

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch full history to ensure we can merge and push
          token: ${{ secrets.READY_PUSHER }} # PAT with content:write (can not use secrets.GITHUB_TOKEN as it is a special case, it does not trigger other workflows on push)

      - uses: devx-cafe/takt-actions/ready-to-trunk@v1
        # with: #Uncomment if you want to override any of the default inputs
        # target_branch: #default is main
        # user_name: #default is "Ready Pusher Bot"
        # user_email: #default is "ready-pusher@${{ github.repository_owner }}.github.com"
        # delete_dev_branch: false # default is true
        # delete_ready_branch: false # default is true
        # close_pr: false # default is true
        # close_issue: false # default is true
