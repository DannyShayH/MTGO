name: Ready
# This workflow is triggered by 'ready' branches

on:
  workflow_dispatch:
  push:
    branches:
      - "ready/**"

concurrency:
  group: ready
  cancel-in-progress: false

jobs:
  build:
    name: Ready flow, runs when a new commit is pushed to a ready branch
    runs-on: ubuntu-latest
    permissions:
      contents: read # required to push the merge commit to trunk
      statuses: write # required to set the trunk-worthy status check and for gh insitu
      pages: write # required to deploy to GitHub Pages

    # Throwaway database for integration tests and application build verification
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa_ci_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up and verify runner environment
        uses: ./.github/actions/prep-runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          verify: gh insitu run trunk-worthy

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # Only this step sees the token. Without the secret the site is built from the sample data
      - name: Collect the board data from Project #2
        working-directory: apps/docs
        env:
          PROJECT_READER: ${{ secrets.PROJECT_READER }}
        run: node scripts/collect-board.ts

      - name: Lint, tests and application builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_ci_build
          JWT_SECRET: ci-only-jwt-secret
          COOKIE_SECRET: ci-only-cookie-secret
          STORE_CORS: http://localhost:8000
          ADMIN_CORS: http://localhost:9000
          AUTH_CORS: http://localhost:8000,http://localhost:9000
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_DEFAULT_REGION: dk
          MEDUSA_TELEMETRY_DISABLED: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          # Used by the docs-build check, so the site is built for its Pages URL
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: gh insitu run ready-checks

      - name: Verify the token is not in the built site
        env:
          PROJECT_READER: ${{ secrets.PROJECT_READER }}
        run: |
          # Fail if the build output is missing, so the grep below cannot pass on nothing
          test -d apps/docs/dist
          test -f apps/docs/dist/flow-metrics.json
          if [ -n "${PROJECT_READER}" ] && grep -rFq -- "${PROJECT_READER}" apps/docs/dist apps/docs/public apps/docs/src/generated; then
            echo "ERROR: PROJECT_READER found in the built site."
            exit 1
          fi

      # on_main deploys exactly this build. ready-to-trunk fast-forwards main, so the SHA is the same
      - name: Upload docs site artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages-${{ github.sha }}
          path: apps/docs/dist
          retention-days: 3

  merge-to-trunk:
    name: Merge to trunk
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      pull-requests: write
      issues: write
      contents: write

    steps:
      - name: Verify READY_PUSHER secret
        shell: bash
        env:
          READY_PUSHER: ${{ secrets.READY_PUSHER }}
        run: |
          if [ -z "${READY_PUSHER}" ]; then
            echo "ERROR: secrets.READY_PUSHER is not configured."
            echo "Create a PAT with content:write enabled and store it as a repository (or organization) secret named READY_PUSHER."
            echo "GitHub: Settings → Secrets and variables → Actions → New repository secret → Name: READY_PUSHER → Value: <PAT>"
            exit 1
          fi
          echo "READY_PUSHER is configured."

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch full history to ensure we can merge and push
          token: ${{ secrets.READY_PUSHER }} # PAT with content:write (can not use secrets.GITHUB_TOKEN as it is a special case, it does not trigger other workflows on push)

      - uses: devx-cafe/takt-actions/ready-to-trunk@v1
        # with: #Uncomment if you want to override any of the default inputs
        # target_branch: #default is main
        # user_name: #default is "Ready Pusher Bot"
        # user_email: #default is "ready-pusher@${{ github.repository_owner }}.github.com"
        # delete_dev_branch: false # default is true
        # delete_ready_branch: false # default is true
        # close_pr: false # default is true
        # close_issue: false # default is true
