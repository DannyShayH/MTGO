name: Daily docs refresh

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: stage
  cancel-in-progress: false

jobs:
  refresh:
    name: Collect, build and deploy the docs site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Collect the board data from Project #2
        working-directory: apps/docs
        env:
          PROJECT_READER: ${{ secrets.PROJECT_READER }}
        run: |
          if [ -z "${PROJECT_READER}" ]; then
            echo "ERROR: PROJECT_READER is required for a live refresh."
            exit 1
          fi
          node scripts/collect-board.ts

      - name: Build docs site
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build --workspace=@dtc/docs

      - name: Verify the token is not in the built site
        env:
          PROJECT_READER: ${{ secrets.PROJECT_READER }}
        run: |
          test -f apps/docs/dist/flow-metrics.json
          if grep -rFq -- "${PROJECT_READER}" apps/docs/dist; then
            echo "ERROR: PROJECT_READER found in the built site."
            exit 1
          fi

      - name: Upload docs site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/dist

      - name: Deploy docs site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
