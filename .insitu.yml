# .insitu.yml - minimal TakT-ready setup

defaults:
  die-on-error: true
  timeout: 5m
  verbose: false

inventory:
  - id: gh-auth
    name: GitHub Authentication
    command: gh auth status

  - id: install-gh-insitu
    name: Install gh-insitu
    command: gh extension install devx-cafe/gh-insitu

  - id: install-gh-tt
    name: Install gh-tt
    command: gh extension install devx-cafe/gh-tt

  - id: install-takt-shortcuts
    name: Install TakT shortcuts
    command: |
      # workon also sets the project's "Start date" (scripts/workon.sh), needed for cycle time
      gh alias set workon '!bash "$(git rev-parse --show-toplevel)/scripts/workon.sh" "$@"' --clobber
      gh alias set wrapup '!gh tt wrapup "$@"' --clobber
      gh alias set deliver '!gh tt deliver "$@"' --clobber
      gh alias set semver '!gh tt semver "$@"' --clobber

  - id: safe-repo
    name: Mark repository as safe for git operations
    command: git config --global --add safe.directory "$(pwd)"

  - id: repo-gitconfig
    name: Use repo-root .gitconfig for consistent git settings
    command: |
      git config --local --get include.path | grep -e ../.gitconfig >/dev/null 2>&1 || \
      git config --local --add include.path ../.gitconfig

  - id: cspell
    name: Run cspell
    command: cspell

  - id: markdownlint
    name: Run markdownlint
    command: markdownlint-cli2

  - id: prettier
    name: Run prettier
    command: prettier --check .

  - id: "install-npm-tools"
    name: "Install linting and checker tools"
    command: |
      npm install -g prettier markdownlint-cli2 cspell @cspell/dict-da-dk @mindovermachine-dev/remote-astro-theme

  - id: verify-npm-tools
    name: Verify linting tools are available
    command: |
      command -v cspell
      command -v markdownlint-cli2
      command -v prettier
      command -v remote-astro-theme

  - id: shellcheck
    name: Check repository shell scripts
    command: shellcheck --enable=require-double-brackets scripts/*.sh

  - id: install-shellcheck
    name: Install ShellCheck
    command: |
      command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }

  - id: npm-install
    name: Install project dependencies from the lockfile
    command: npm ci

  - id: unit-tests
    name: Run backend unit tests (fast, no database)
    command: |
      cd apps/backend && npm run test:unit -- --passWithNoTests

  - id: package-tests
    name: Run the shared package tests (fast, no database)
    command: |
      cd packages/i18n && npm test
      cd ../ui && npm test
      cd ../next-react && npm test
      cd ../logging && npm test

  - id: react-copies
    name: Check that each Next.js app renders with its own React copy (#82)
    command: npm run check:react

  - id: architecture
    name: Check architecture rules with dependency-cruiser (.dependency-cruiser.cjs)
    command: npm run arch

  - id: coverage
    name: Run backend unit and HTTP tests with coverage (lcov in apps/backend/coverage)
    command: |
      cd apps/backend && npm run test:coverage

  - id: lint
    name: Run ESLint for all apps (medusa lint + storefront eslint)
    command: npm run lint

  - id: integration-modules
    name: Run backend module integration tests (needs Postgres)
    timeout: 15m
    command: |
      cd apps/backend && npm run test:integration:modules -- --passWithNoTests

  - id: integration-http
    name: Run backend HTTP integration tests (needs Postgres)
    timeout: 15m
    command: |
      cd apps/backend && npm run test:integration:http -- --passWithNoTests

  - id: application-builds
    name: Build, type check and browser test the backend, admin and storefront
    timeout: 30m
    command: npm run verify:applications

  - id: docs-tests
    name: Run the docs app tests with Vitest (ADR-0001)
    command: |
      cd apps/docs && npx vitest run

  - id: docs-build
    name: Type check, build and link check the docs site (apps/docs)
    command: |
      # SITE_ORIGIN and BASE_PATH come from actions/configure-pages in the ready flow
      cd apps/docs && npm run check && npm run build && npm run check:links

  - id: "fix-markdown"
    name: "Fix all fixable markdown issues"
    command: |
      markdownlint-cli2 --fix

  - id: "fix-prettier"
    name: "Fix all fixable prettier issues"
    command: |
      prettier --write .

waves:
  - id: post-create
    name: Dev Container Post Create
    parallel: true
    checks:
      - gh-auth
      - install-npm-tools
      - install-shellcheck
      - install-gh-insitu
      - install-gh-tt
      - install-takt-shortcuts
      - safe-repo
      - repo-gitconfig
      - npm-install

  - id: "prep-runner"
    name: "Run to prepare GitHub runner"
    parallel: true
    checks:
      - gh-auth
      - install-gh-insitu
      - repo-gitconfig
      - install-npm-tools
      - install-shellcheck
      - npm-install

  # Runs on every commit (pre-commit hook) and on push to an issue branch (on_dev.yml).
  # Keep it fast: no database, no build.
  - id: trunk-worthy
    name: Minimum quality checks before commit
    parallel: true
    checks:
      - cspell
      - markdownlint
      - prettier
      - unit-tests
      - package-tests
      - react-copies
      - architecture
      - lint
      - shellcheck

  # Separate CI jobs own disjoint check statuses. Only backend needs trunk-worthy too.
  - id: ready-backend
    name: Lint and backend tests before merge to trunk
    parallel: false
    checks:
      - lint
      - coverage
      - integration-modules

  - id: ready-applications
    name: Application builds and browser tests before merge to trunk
    parallel: false
    checks:
      - application-builds

  - id: ready-docs
    name: Docs tests and build before merge to trunk
    parallel: false
    checks:
      - docs-tests
      - docs-build

  # Local aggregate; dependency verification mirrors these checks. HTTP runs through coverage.
  # Needs a reachable disposable Postgres and Chromium installed.
  - id: ready-checks
    name: All checks before merge to trunk
    parallel: false
    checks:
      - lint
      - coverage
      - integration-modules
      - application-builds
      - docs-tests
      - docs-build

  - id: "fix-all"
    name: "Fix anything that can be fixed automatically"
    parallel: true
    checks:
      - "fix-markdown"
      - "fix-prettier"
