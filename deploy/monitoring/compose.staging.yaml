# Staging request monitoring on the Droplet (issue #194). Run only through
# `mtogo-deploy.sh monitoring up|update`: `update` copies this folder from a
# release's backend image to /srv/mtogo-monitoring/config, where it stays
# through deploys and rollback (#180); both supply /srv/mtogo-staging/.env; see
# apps/docs/src/content/docs/quality/staging-request-monitoring.md.
#
# Separate project from the application (mtogo-staging): deploys never start,
# stop or recreate these containers, and this file never touches the
# application, Caddy or PostgreSQL. The scrape network is created by the
# application project (deploy/staging/compose.yaml); this project only joins it.
#
# Approved backend events (#176): Loki and Alloy run only with the `logs`
# profile, which mtogo-deploy.sh enables when STAGING_LOGS_ENABLED=1.
#
# Exposure: Prometheus, Loki, Alloy and the backend exporter publish no ports
# and have no Caddy route. Grafana publishes one port on STAGING_BIND_ADDRESS for Caddy,
# which serves it over HTTPS with a login (no anonymous access, no sign-up).
name: mtogo-staging-monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
      - --query.lookback-delta=30s
    environment:
      # Lets the Go runtime collect garbage before the hard cap is reached.
      GOMEMLIMIT: 160MiB
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    networks:
      - metrics
      # Scrapes the health of Alloy and Loki (#179).
      - logs
    logging: *logging
    # Same value as the memory limit: no additional swap, so the cap is hard.
    memswap_limit: 192m
    deploy:
      resources:
        limits:
          memory: 192m

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    environment:
      GOMEMLIMIT: 220MiB
      GF_SERVER_ROOT_URL: ${STAGING_GRAFANA_URL:?STAGING_GRAFANA_URL is missing in .env}
      # Applied only when Grafana creates its database on the first start.
      GF_SECURITY_ADMIN_USER: staging-admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is missing in .env}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      # Never 0.0.0.0: only Caddy (and an administrator's SSH tunnel) reach it.
      - "${STAGING_BIND_ADDRESS:-127.0.0.1}:${STAGING_GRAFANA_PORT:-3300}:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - loopback
      - metrics
      - logs
    logging: *logging
    memswap_limit: 448m
    deploy:
      resources:
        limits:
          memory: 448m

  loki:
    image: grafana/loki:3.7.10
    profiles: ["logs"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    environment:
      GOMEMLIMIT: 200MiB
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks:
      - logs
    logging: *logging
    memswap_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256m

  # Reads only the backend, partner and storefront containers of the
  # mtogo-staging project through the Docker socket. A read-only mount does
  # not limit the Docker API calls Alloy could make; the admin accepts that
  # when enabling the profile.
  alloy:
    image: grafana/alloy:v1.22.0
    # Root inside the container, only to read the Docker socket.
    user: "0"
    profiles: ["logs"]
    restart: unless-stopped
    # Alloy sends what is queued for up to 15 seconds; Docker's default is 10.
    stop_grace_period: 30s
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      # Health counters for Prometheus (#179), on the internal logs network only.
      - --server.http.listen-addr=0.0.0.0:12345
      - --server.http.enable-pprof=false
      - --server.http.disable-support-bundle=true
      - /etc/alloy/config.alloy
    environment:
      GOMEMLIMIT: 120MiB
      MTOGO_LOG_PROJECT: mtogo-staging
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - logs
    depends_on:
      - loki
    logging: *logging
    memswap_limit: 160m
    deploy:
      resources:
        limits:
          memory: 160m

networks:
  # Internal scrape network owned by the mtogo-staging application project.
  metrics:
    external: true
    name: mtogo-staging-metrics
  # Publishes Grafana's single port for Caddy (same role as in compose.yaml).
  loopback:
  # Prometheus, Grafana, Loki and Alloy only; no route out.
  logs:
    internal: true

# Application deploys and rollback never touch these volumes because they
# belong to another Compose project, not because of their names (#180). The
# names equal Compose's defaults and only keep history, accounts and collector
# positions in place if the project is ever renamed. `down --volumes` on
# mtogo-staging-monitoring still deletes them.
volumes:
  prometheus-data:
    name: mtogo-staging-monitoring_prometheus-data
  grafana-data:
    name: mtogo-staging-monitoring_grafana-data
  loki-data:
    name: mtogo-staging-monitoring_loki-data
  alloy-data:
    name: mtogo-staging-monitoring_alloy-data
