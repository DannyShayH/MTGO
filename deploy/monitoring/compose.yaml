# Local-only monitoring. Application releases have a separate Compose lifecycle.
name: mtogo-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --query.lookback-delta=30s
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    networks:
      - metrics
      # Scrapes the health of Alloy and Loki (#179).
      - logs
      # Scrapes the host through Node Exporter (#182).
      - host-metrics
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: local-admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Generate a local password in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Everyone lands on the request dashboard after signing in (#246).
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/backend-requests.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - loopback
      - metrics
      - logs
    logging: *logging

  # Approved application events (#176, #177). Neither publishes a port.
  loki:
    image: grafana/loki:3.7.10
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks:
      - logs
    logging: *logging

  alloy:
    image: grafana/alloy:v1.22.0
    # Root inside the container, only to read the Docker socket.
    user: "0"
    # Alloy sends what is queued for up to 15 seconds; Docker's default is 10.
    stop_grace_period: 30s
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      # Health counters for Prometheus (#179), on the internal logs network only.
      - --server.http.listen-addr=0.0.0.0:12345
      - --server.http.enable-pprof=false
      - --server.http.disable-support-bundle=true
      - /etc/alloy/config.alloy
    environment:
      MTOGO_LOG_PROJECT: mtogo-monitoring-demo
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Read-only mount: it does not restrict which Docker API calls are made.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - logs
    depends_on:
      - loki
    logging: *logging

  # Host CPU, load, memory, swap and free disk (#182). It sees no host folder: a file on the
  # root file system and an empty volume are enough to read how full the disks
  # under them are, and /proc already shows the host's CPU, load and memory.
  node-exporter:
    image: prom/node-exporter:v1.13.1
    command:
      - --web.disable-exporter-metrics
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.loadavg
      - --collector.meminfo
      - --collector.filesystem
      - --collector.filesystem.mount-points-include=^/host/(root|docker-volumes)$$
      # Overlay and tmpfs are read too: a virtual machine's root can be either.
      - --collector.filesystem.fs-types-exclude=^(erofs|squashfs)$$
    environment:
      GOMEMLIMIT: 32MiB
    volumes:
      - /etc/hostname:/host/root:ro
      - node-exporter-disk:/host/docker-volumes:ro
    networks:
      - host-metrics
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging
    memswap_limit: 48m
    deploy:
      resources:
        limits:
          memory: 48m

networks:
  loopback:
  metrics:
    external: true
    name: mtogo-local-metrics
  logs:
    internal: true
  # Prometheus and Node Exporter only; no route out.
  host-metrics:
    internal: true

# Application deploys and rollback never touch these volumes because they
# belong to another Compose project, not because of their names (#180). The
# names equal Compose's defaults and only keep history, accounts and collector
# positions in place if the project is ever renamed. `down --volumes` on
# mtogo-monitoring still deletes them.
volumes:
  prometheus-data:
    name: mtogo-monitoring_prometheus-data
  grafana-data:
    name: mtogo-monitoring_grafana-data
  loki-data:
    name: mtogo-monitoring_loki-data
  alloy-data:
    name: mtogo-monitoring_alloy-data
  # Stays empty: only tells which disk the Docker volumes are on.
  node-exporter-disk:
    name: mtogo-monitoring_node-exporter-disk
