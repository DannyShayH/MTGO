apiVersion: 1
providers:
  - name: MTOGO backend
    orgId: 1
    folder: MTOGO
    type: file
    # A dashboard whose file leaves Git also leaves Grafana (#246). Viewers
    # still cannot delete or change a provisioned dashboard.
    disableDeletion: false
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
