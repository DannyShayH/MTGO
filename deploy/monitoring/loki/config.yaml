# Single-process Loki for approved application events (#176). Internal only:
# no published port; Grafana and Alloy reach it on the monitoring network.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-11-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Labels are exactly what Alloy sets: no added service_name or level data.
  discover_service_name: []
  discover_log_levels: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  retention_period: 168h
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  max_label_names_per_series: 5

# Seven-day retention is applied by the compactor; it is a time policy, not a
# disk quota (#178 and #182 measure and bound storage).
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem

pattern_ingester:
  enabled: false

analytics:
  reporting_enabled: false
