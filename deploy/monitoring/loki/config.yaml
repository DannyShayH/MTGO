# Single-process Loki for approved application events (#176). Internal only:
# no published port; Grafana and Alloy reach it on the monitoring network.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

querier:
  # Always ask for records not yet written to disk too. Long queries are split
  # by the hour, and by default parts over three hours old would miss freshly
  # imported history for up to half an hour (#178).
  query_ingesters_within: 0s

schema_config:
  configs:
    - from: 2026-11-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Labels are exactly what Alloy sets: no added service_name or level data.
  discover_service_name: []
  discover_log_levels: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  retention_period: 168h
  # A chunk is deleted only when its newest record expires, and later still by
  # the compactor's delay. No query returns a record older than seven days.
  max_query_lookback: 168h
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  max_label_names_per_series: 5

# Seven-day retention is applied by the compactor, whose state is in the same
# volume. It marks expired chunks at every interval and deletes their files two
# hours later (Loki's default delay). It is a time policy, not a disk quota
# (#182 bounds storage), and separate from Docker's rotation of the source logs.
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem

pattern_ingester:
  enabled: false

analytics:
  reporting_enabled: false
