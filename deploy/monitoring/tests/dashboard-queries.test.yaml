            value: 1.5
      - expr: 'topk(10, histogram_quantile(0.95, sum by (le, method, route) (rate(mtogo_http_request_duration_seconds_bucket{job="mtogo-backend"}[5m]) and on(job, instance) (up{job="mtogo-backend"} == 1))) and on(method, route) (sum by (method, route) (increase(mtogo_http_request_duration_seconds_count{job="mtogo-backend"}[5m]) and on(job, instance) (up{job="mtogo-backend"} == 1)) > 0))'
        eval_time: 10m
