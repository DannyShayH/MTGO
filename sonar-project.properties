sonar.projectKey=DannyShayH_MTGO
sonar.organization=dannyshayh
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Analyze application source and tooling; generated output is outside these roots.
sonar.sources=apps/backend/src,apps/storefront/src,apps/docs/src,apps/docs/scripts,scripts
sonar.tests=apps/backend/src,apps/backend/integration-tests,apps/storefront/e2e,apps/docs/src,apps/docs/scripts
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.spec.ts,**/*.spec.js
sonar.exclusions=**/__tests__/**,**/*.test.ts,**/*.spec.ts,**/*.spec.js,**/*.d.ts,apps/docs/src/generated/**,apps/docs/src/content/docs/architecture/glossary.md,apps/docs/src/content/docs/architecture/dependency-graph.md,apps/docs/src/content/docs/architecture/decisions/**,apps/docs/src/content/docs/architecture/modules/**,apps/docs/src/content/docs/product/case.md

# Match the backend Jest coverage scope. Other apps are analyzed without coverage.
sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info
sonar.coverage.exclusions=apps/storefront/**,apps/docs/**,scripts/**,apps/backend/src/**/migrations/**,apps/backend/src/admin/**,apps/backend/src/scripts/**,apps/backend/src/migration-scripts/**
